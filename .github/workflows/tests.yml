name: tests

on:
  push:
    branches: [main]
    paths:
      - 'dev/**'
      - 'tools/**'
      - 'verification/**'
      - 'docs/**'
      - 'releases/**'
      - 'archive/**'
      - '.github/workflows/tests.yml'
      - 'VERSION'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  regression:
    name: Regression ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact tokenizer
        run: python -m pip install -r dev/requirements-release.txt
      - name: Version source is consistent
        run: python tools/sync_version.py --check
      - name: Repository entrypoints and links
        run: python tools/check_repository.py
      - name: Full source regression
        run: >
          python tools/run_regression.py
          --json-out "${{ runner.temp }}/regression.json"
          --log-out "${{ runner.temp }}/regression.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/regression.json
            ${{ runner.temp }}/regression.log
          if-no-files-found: warn

  candidate:
    name: Candidate, suites, DOM and evidence (ubuntu-latest / 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: verification/plugin/package-lock.json
      - name: Install exact tokenizer
        run: python -m pip install -r dev/requirements-release.txt
      - name: Version source is consistent
        run: python tools/sync_version.py --check
      - name: Repository checks
        run: |
          mkdir -p dist
          python tools/check_repository.py --json > dist/repository_check.json
      - name: Build the canonical candidate
        run: python tools/build_unified_plugin.py --out-dir dist --require-clean
      - name: Build a second time and compare the actual bytes
        run: |
          python tools/build_unified_plugin.py --out-dir dist/second --require-clean
          python - <<'PY'
          import json
          first = json.load(open("dist/build_manifest.json", encoding="utf-8"))
          second = json.load(open("dist/second/build_manifest.json", encoding="utf-8"))
          assert first["archive_sha256"] == second["archive_sha256"], "zip hash differs"
          assert first["file_count"] == second["file_count"], "file count differs"
          assert first["files"] == second["files"], "file list differs"
          print("two builds are byte-identical:", first["archive_sha256"])
          PY
      - name: Verify the archive (stub host)
        run: >
          python tools/verify_unified_plugin.py
          --dist dist --host stub --report dist/package_verification.json
      - name: Prove invalid archives are rejected
        run: >
          python tools/verify_unified_plugin.py
          --dist dist --self-test --self-test-report dist/selftest.json
      - name: Export twice and compare A/B, then the engineering layout
        run: |
          python tools/export_astrbot_plugin.py --layout archive --output dist/export-a
          python tools/export_astrbot_plugin.py --layout archive --output dist/export-b
          diff -r dist/export-a dist/export-b
          python tools/export_astrbot_plugin.py --layout engineering --output dist/plugin_export
          python tools/export_astrbot_plugin.py --layout engineering --check dist/plugin_export
      - name: Package suites on the same candidate
        run: >
          python tools/run_package_regression.py --dist dist
          --suites completion,core,legacy
          --report dist/package_regression.json
          --log dist/package_regression.log
      - name: Install locked UI dependencies
        working-directory: verification/plugin
        run: npm ci
      - name: DOM wiring check (jsdom, not a browser)
        run: python tools/run_dom_check.py --dist dist --report dist/ui_dom.json --node node
      - name: Source regression for the acceptance record
        run: >
          python tools/run_regression.py
          --json-out dist/regression.json --log-out dist/regression.log
      - name: Create the source zip from the tested commit
        run: |
          git -c core.autocrlf=false -c core.eol=lf archive --format=zip \
            -o "dist/source-$(cat VERSION).zip" HEAD
      - name: Record the acceptance result
        run: python tools/record_acceptance.py
      - name: Build the complete release set (after the evidence)
        run: >
          python tools/build_engineering_bundle.py --dist dist --out-dir dist/release
          --source-zip "dist/source-$(cat VERSION).zip"
      - name: Check the release set, including a rebuild from the source zip
        run: >
          python tools/check_release_set.py --release-dir dist/release
          --report dist/release_set.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/build_manifest.json
            dist/package_verification.json
            dist/selftest.json
            dist/regression.json
            dist/regression.log
            dist/package_regression.json
            dist/package_regression.log
            dist/ui_dom.json
            dist/release_set.json
            dist/repository_check.json
            dist/release/*
            dist/plugin_export/SOURCE_MANIFEST.json
            dev/reports/current_acceptance.json
            dev/reports/acceptance/**
          if-no-files-found: warn

  package-suites:
    name: Package suites ${{ matrix.os }} / ${{ matrix.python-version }}
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact tokenizer
        run: python -m pip install -r dev/requirements-release.txt
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: downloaded
      - name: Run the package suites on the verified candidate
        shell: bash
        run: |
          mkdir -p dist
          cp -r downloaded/dist/. dist/
          python tools/run_package_regression.py --dist dist --suites completion,core,legacy --report "${{ runner.temp }}/package_regression.json" --log "${{ runner.temp }}/package_regression.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-suites-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/package_regression.json
            ${{ runner.temp }}/package_regression.log
          if-no-files-found: warn
