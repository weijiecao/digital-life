name: tests

on:
  push:
    branches: [main]
    paths:
      - 'dev/**'
      - 'testbed/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: 离线回归（${{ matrix.python-version }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 说明
        run: |
          python --version
          Write-Host '测试全部用替身（stub AstrBot、假编码器），不需要 torch/模型，也不联网。'

      - name: Offline regression
        working-directory: dev
        run: |
          python -m unittest -q `
            tests.test_store tests.test_plugin tests.test_data_safety tests.test_v1_5_consolidator `
            tests.test_b4_fixture tests.test_b4_reliability tests.test_b4_gate `
            tests.test_b4_lease_fencing tests.test_b4_provenance `
            tests.test_b4_replay_mapping `
            tests.test_b4_frozen_fork `
            tests.test_b4_unit_of_work `
            tests.test_b4_scope_lease tests.test_b4_crash_unit `
            tests.test_memory_engine_worker tests.test_memory_engine_rejudge `
            tests.test_memory_engine_engine tests.test_memory_engine_cli `
            tests.test_memory_engine_host tests.test_memory_engine_summary `
            tests.test_memory_engine_token_budget tests.test_memory_engine_shadow `
            tests.test_memory_engine_render `
            tests.test_memory_engine_cache_persistent `
            tests.test_memory_engine_backup `
            tests.test_memory_engine_host_budget `
            tests.test_m1_provider_timeout `
            tests.test_shadow_preflight `
            tests.test_r0_bundle `
            tests.test_memory_index_update tests.test_memory_store_backup `
            tests.test_v1_5b_t1_t2_fixes tests.test_baseline_alignment tests.test_preflight `
            tests.test_auto_jobs tests.test_backup_regression tests.test_prewarm tests.test_model_judge `
            tests.test_delivery tests.test_soak tests.test_threshold tests.test_correction tests.test_metrics `
            tests.test_real_corpus tests.test_background tests.test_package tests.test_attribution `
            tests.test_panel tests.test_integration_chain
