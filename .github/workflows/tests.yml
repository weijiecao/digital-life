name: tests

on:
  push:
    branches: [main]
    paths: ['dev/**', 'testbed/**', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Regression ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact tokenizer
        run: python -m pip install -r dev/requirements-release.txt
      - name: Full discovered regression
        working-directory: dev
        run: python -m unittest discover -v -s tests -t .
      - name: Build source-bound candidate
        working-directory: dev
        run: python scripts/build_r0_bundle.py --out "${{ runner.temp }}/memory-engine-r0-rc2.zip"
      - name: Verify extracted candidate in isolated process
        working-directory: dev
        run: python scripts/verify_r0_bundle.py --bundle "${{ runner.temp }}/memory-engine-r0-rc2.zip" --exact-budget --out "${{ runner.temp }}/bundle-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rc2-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/memory-engine-r0-rc2.zip
            ${{ runner.temp }}/memory-engine-r0-rc2.json
            ${{ runner.temp }}/bundle-verification.json
