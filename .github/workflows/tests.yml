name: tests

on:
  push:
    branches: [main]
    paths:
      - 'dev/**'
      - 'testbed/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: 离线回归（${{ matrix.python-version }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 说明
        run: |
          python --version
          Write-Host '测试全部用替身（stub AstrBot、假编码器），不需要 torch/模型，也不联网。'

      - name: 离线回归 339 项
        working-directory: dev
        run: |
          python -m unittest -q `
            tests.test_store tests.test_plugin tests.test_baseline_alignment tests.test_preflight `
            tests.test_auto_jobs tests.test_backup_regression tests.test_prewarm tests.test_model_judge `
            tests.test_delivery tests.test_soak tests.test_threshold tests.test_correction tests.test_metrics `
            tests.test_real_corpus tests.test_background tests.test_package tests.test_attribution `
            tests.test_panel tests.test_integration_chain
